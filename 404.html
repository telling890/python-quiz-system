  <head><script>/* 由 scripts/assemble-site.mjs 注入：只接住 /app/ 下的深链接，其它 404 回到介绍页 */(function(){var appBase="/python-quiz-system/app/";var siteBase="/python-quiz-system/";if(location.pathname.indexOf(appBase)!==0){location.replace(siteBase);}})();</script>

    <title>Python 刷题系统</title>
    <script>
      // 首帧之前就把主题定下来，避免深色用户先看到白闪一下
      (function () {
        try {
          var saved = localStorage.getItem("pyquiz.theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
            document
              .querySelector('meta[name="theme-color"]')
              ?.setAttribute("content", saved === "light" ? "#eef1f7" : "#0b1020");
          }
        } catch (e) {
          /* 隐私模式下 localStorage 不可用，按系统走 */
        }
      })();
    </script>
