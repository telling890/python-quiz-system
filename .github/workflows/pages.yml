name: 发布网页版（gh-pages 分支）

# 站点结构（同一个仓库只有一个 Pages 站点，所以两块拼在一起）：
#   /<仓库>/            项目介绍页（site/，纯静态，无构建步骤）
#   /<仓库>/app/        刷题应用（frontend 静态版：题库内置、进度存浏览器、判题用 Pyodide）
#   /<仓库>/404.html    应用外壳 + 守卫脚本：/app/ 下的深链接刷新仍进应用，其它 404 回介绍页
#
# base 与子路径不在这里指定：build.mjs 与 assemble-site.mjs 各自从 GITHUB_REPOSITORY
# 推成 /<仓库>/app/（两处必须一致，下面的「检查产物」会断言）。
# 构建产物推到 gh-pages 分支，GitHub Pages 直接读这个分支，不需要任何服务器，
# 也不需要去设置里选 "GitHub Actions"（分支部署最简单、最不容易踩权限坑）。
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "site/**"
      - "backend/app/data/questions.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: 构建并发布
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # 题库复制成 bank.json、生成 404.html（前端路由回退）也在这一步里做；
      # 静态版的 base 由 scripts/build.mjs 推成 /<仓库>/app/
      - name: 构建静态版
        run: npm run build:static

      # 应用搬进 dist/app/，介绍页放到 dist 根，再生成站点级的 404.html
      - name: 组装站点（介绍页 + 应用）
        run: node scripts/assemble-site.mjs

      - name: 检查产物
        run: |
          test -f dist/index.html                      # 介绍页
          test -f dist/assets/site.css
          test -f dist/assets/site.js
          test -f dist/assets/img/hero-workspace.webp
          test -f dist/app/index.html                  # 刷题应用
          test -f dist/app/bank.json
          test -d dist/app/assets
          test -f dist/404.html
          grep -q "/app/assets/" dist/app/index.html   # 应用的资源路径在 /app/ 下
          grep -q "appBase" dist/404.html              # 守卫脚本已注入
          grep -q "app/" dist/404.html                 # 守卫里的 appBase 非空
          du -sh dist

      - name: 停用 Jekyll（下划线开头的文件会被它忽略）
        run: touch dist/.nojekyll

      - name: 推送到 gh-pages
        working-directory: frontend/dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "deploy: 介绍页 + 静态版网页（${GITHUB_SHA:0:7}）"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
