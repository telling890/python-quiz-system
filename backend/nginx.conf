# Python 刷题系统 · 反向代理示例
# 生产请补上 TLS（certbot / 云厂商证书），并把 server_name 换成你的域名。

upstream quiz_api {
    server api:8000;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=quiz_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=quiz_api:10m rate=120r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    # 题面里有中文和代码，压缩收益很大
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        proxy_pass http://quiz_api;
        access_log off;
    }

    location /api/v1/auth/ {
        limit_req zone=quiz_auth burst=5 nodelay;
        proxy_pass http://quiz_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=quiz_api burst=40 nodelay;
        proxy_pass http://quiz_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # FastAPI 自带文档；要不要对外开放自行决定
    location /docs {
        proxy_pass http://quiz_api;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://quiz_api;
        proxy_set_header Host $host;
    }

    # 网页版前端：服务器在 "/" 返回 web/index.html（并注入 /auth.js 登录脚本）
    location / {
        proxy_pass http://quiz_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # 页面和接口都不该被缓存（换账号/换令牌时最容易踩这个坑）
        add_header Cache-Control "no-store" always;
    }
}
